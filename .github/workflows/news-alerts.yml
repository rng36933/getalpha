name: Poll for news alerts

# Vercel's Hobby plan can only run a cron once a day, which is too coarse for
# a ~30-minute-ahead heads-up before each release. GitHub Actions has no such
# limit, so the polling lives here instead — it just calls the app's own
# endpoint, which does the actual work and de-duplicates by event.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call the news-alert endpoint
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.NEWS_ALERT_CRON_SECRET }}" \
            "https://www.getalpha.org/api/cron/news-alert")
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
