name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push while the first is still building makes the first irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    env:
      # Placeholders, not secrets. `next build` needs these to exist because
      # Prisma and Clerk read them as modules load, and Clerk parses the
      # publishable key rather than just holding it — so it has to be
      # well-formed, not merely present. Nothing here connects anywhere: the
      # build never reaches a database, and every provider call is behind a
      # fallback that logs and carries on.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci
      ANTHROPIC_API_KEY: sk-ant-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file pins, so a transitive dependency cannot change under CI.
      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks as part of the build, but running tsc first
      # puts a type error in its own step instead of buried in build output.
      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npx next build

      # Last, and separate from the build on purpose. Vercel checks plan limits
      # when it deploys, not when it builds, so a violation compiles cleanly,
      # passes every step above, and then fails on the platform with nothing in
      # the compiler output to explain it.
      - name: Deployment limits
        run: node scripts/check-deploy-limits.mjs
